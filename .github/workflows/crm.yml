name: CRM CI/CD

on:
  push:
    branches: [ main, master ]
    paths:
      - 'CRM/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'CRM/**'

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Dependencies
        working-directory: CRM/backend
        run: npm install
      - name: Run Lint/Check
        working-directory: CRM/backend
        run: |
          # Basic syntax check if no lint script
          node --check app.js

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Dependencies
        working-directory: CRM/frontend
        run: npm install
      - name: Build
        working-directory: CRM/frontend
        run: npm run build
